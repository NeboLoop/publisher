[package]
name = "neboai"
version = "0.2.0"
edition = "2021"
description = "CLI for publishing to the NeboAI marketplace"
license = "Apache-2.0"
repository = "https://github.com/NeboLoop/publisher"

[[bin]]
name = "neboai"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
dirs = "6"
open = "5"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
tiny_http = "0.12"
url = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
