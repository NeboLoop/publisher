# Release: a vX.Y.Z tag runs the release build in release-build.yml, ALWAYS as
# it is on main. The build checks out the tag's code, but its steps come from
# main: the Mac and Windows release runners accept only
# release-build.yml@refs/heads/main, so the tag cannot change what runs on
# them. See release-build.yml for what a release does.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # the GitHub Release (release-build.yml's release job)
    uses: NeboLoop/publisher/.github/workflows/release-build.yml@main
    secrets: inherit
