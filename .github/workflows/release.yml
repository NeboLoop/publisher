name: Release

# Tag vX.Y.Z (matching cli/Cargo.toml and package.json) to release:
#   1. build      — the neboai CLI for five platforms
#   2. release    — GitHub release with the binaries, the skill package
#                   (neboai-skill.tar.gz, used by install.sh / install.ps1)
#                   and SHA256SUMS
#   3. homebrew   — renders packaging/neboai.rb.tmpl into NeboLoop/homebrew-tap
#                   Formula/neboai.rb (needs secret TAP_GITHUB_TOKEN)
#   4. npm        — publishes @neboai/publisher (needs secret NPM_TOKEN)
# homebrew and npm only depend on release, so one failing never stops the other
# or the GitHub release; each fails loudly with the fix in its error.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: [self-hosted, Linux, ARM64, neboloop]
    steps:
      - uses: actions/checkout@v4
      # node reads package.json's version; the stadium VM has no system node.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag matches cli/Cargo.toml and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' cli/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          npm_v=$(node -p "require('./package.json').version")
          if [ "$tag" != "$cargo_v" ] || [ "$tag" != "$npm_v" ]; then
            echo "::error title=Version mismatch::tag $GITHUB_REF_NAME, cli/Cargo.toml $cargo_v, package.json $npm_v. Bump both to $tag and tag again."
            exit 1
          fi

  # ─── x86 runner: a DigitalOcean droplet that exists only for this run ───
  # GitHub-hosted runners are never used (the org's Actions budget is spent).
  # This job only calls doctl and gh, on the stadium orchestration runners;
  # the droplet boots from the nebo-runner-amd64-base snapshot with a
  # just-in-time registration good for ONE job, and the -down job deletes it.
  linux-amd64-runner:
    needs: check-version
    runs-on: [self-hosted, Linux, ARM64, neboloop-orch] # orchestration only
    steps:
      # Install only. Up to four jobs share this VM's HOME, and `doctl auth
      # init` in each rewrote one shared config file under the others. Every
      # doctl call takes the token from the environment and a config dir of
      # its own job.
      - uses: digitalocean/action-doctl@v2
        with:
          no_auth: "true"
      # A just-in-time runner carries ONLY the labels named here, so the
      # build's runs-on list must spell them out in full.
      - name: Mint a one-job runner registration
        id: jit
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: publisher-amd64-${{ github.run_id }}
          LABEL: publisher-amd64-${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cfg=$(gh api -X POST "orgs/$OWNER/actions/runners/generate-jitconfig" \
            -f name="$NAME" -F runner_group_id=1 -f work_folder=_work \
            -f "labels[]=self-hosted" -f "labels[]=Linux" -f "labels[]=X64" \
            -f "labels[]=$LABEL" -q .encoded_jit_config)
          echo "::add-mask::$cfg"
          echo "config=$cfg" >> "$GITHUB_OUTPUT"
      - name: Boot the droplet from the golden snapshot
        env:
          JIT: ${{ steps.jit.outputs.config }}
          NAME: publisher-amd64-${{ github.run_id }}
          RUN_TAG: run-${{ github.run_id }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/doctl-config
        run: |
          image=$(doctl compute image list-user --format ID,Name --no-header | awk '$2=="nebo-runner-amd64-base"{print $1}' | tail -n1)
          test -n "$image" || { echo "snapshot nebo-runner-amd64-base not found"; exit 1; }
          ud="$RUNNER_TEMP/user-data-$NAME.sh"
          cat > "$ud" <<'EOS'
          #!/bin/bash
          # A droplet booted from a snapshot comes up with root's password
          # expired, which blocks even key-based SSH; clear that so the box
          # can be inspected while it lives.
          chage -d "$(date +%F)" -M -1 root
          cd /home/runner/actions-runner
          nohup sudo -u runner ./run.sh --jitconfig '__JIT__' > /home/runner/runner.log 2>&1 &
          EOS
          sed -i "s|__JIT__|$JIT|" "$ud"
          # --ssh-keys: with no key DigitalOcean emails the owner a root
          # password for every droplet. Nobody logs in.
          # nyc3 capacity comes and goes per size (a 422 "not available");
          # any other error is fatal.
          id=""
          for size in s-8vcpu-16gb s-8vcpu-16gb-amd s-8vcpu-16gb-intel s-4vcpu-16gb-320gb-intel; do
            if id=$(doctl compute droplet create "$NAME" \
                --region nyc3 --size "$size" --image "$image" \
                --tag-names "nebo-ci-runner,$RUN_TAG" \
                --ssh-keys 15:57:9d:98:dc:e4:b9:b5:69:e2:42:d8:08:86:08:86 \
                --user-data-file "$ud" --wait --format ID --no-header 2>"$ud.err"); then
              echo "droplet size: $size"; break
            fi
            grep -q "not available in this region" "$ud.err" || { cat "$ud.err"; rm -f "$ud" "$ud.err"; exit 1; }
            echo "$size is not available in nyc3 right now, trying the next size"
          done
          rm -f "$ud" "$ud.err"
          [ -n "$id" ] || { echo "::error::no droplet size available in nyc3"; exit 1; }
      - name: Wait for the runner to come online
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: publisher-amd64-${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "orgs/$OWNER/actions/runners?name=$NAME" -q '.runners[0].status // "absent"')
            [ "$status" = online ] && { echo "runner online after $((i*10))s"; exit 0; }
            sleep 10
          done
          echo "runner never came online"; exit 1

  build:
    needs: [check-version, linux-amd64-runner]
    strategy:
      matrix:
        include:
          # House runners, the same ones NeboLoop/nebo releases on.
          - target: aarch64-apple-darwin
            runner: '["self-hosted","macOS","stadium-mac"]'
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            runner: '["self-hosted","macOS","stadium-mac"]'
            platform: darwin-amd64
          - target: aarch64-unknown-linux-musl
            runner: '["self-hosted","Linux","ARM64","neboloop"]'
            platform: linux-arm64
          # linux-amd64 on a DigitalOcean droplet booted for this run
          # (linux-amd64-runner below) and deleted after it: there is no house
          # x86 Linux machine, and GitHub-hosted runners are never used.
          - target: x86_64-unknown-linux-musl
            runner: '["self-hosted","Linux","X64","publisher-amd64-${{ github.run_id }}"]'
            platform: linux-amd64
          - target: x86_64-pc-windows-msvc
            runner: '["self-hosted","Windows","X64","stadium-win"]'
            platform: windows-amd64
            windows: true

    runs-on: ${{ fromJSON(matrix.runner) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          # Native builds on both Linux runners: musl-gcc for the host arch.
          if ! command -v musl-gcc >/dev/null; then
            sudo -n apt-get update && sudo -n apt-get install -y musl-tools \
              || { echo "::error::musl-tools is missing on this runner and sudo needs a password. Install it once: sudo apt-get install -y musl-tools"; exit 1; }
          fi

      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: ${{ !matrix.windows }}
        run: strip cli/target/${{ matrix.target }}/release/neboai

      - name: Rename binary (Unix)
        if: ${{ !matrix.windows }}
        run: cp cli/target/${{ matrix.target }}/release/neboai neboai-${{ matrix.platform }}

      - name: Rename binary (Windows)
        if: ${{ matrix.windows }}
        run: cp cli/target/${{ matrix.target }}/release/neboai.exe neboai-${{ matrix.platform }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neboai-${{ matrix.platform }}
          path: neboai-${{ matrix.platform }}*

  # The droplet is deleted whether the job passed, failed, was cancelled or
  # never ran.
  linux-amd64-runner-down:
    needs: [linux-amd64-runner, build]
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, ARM64, neboloop-orch] # orchestration only
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          no_auth: "true"
      - name: Delete this run's droplet, and any runner droplet older than three hours
        env:
          NAME: publisher-amd64-${{ github.run_id }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/doctl-config
        run: |
          doctl compute droplet list --tag-name nebo-ci-runner --format ID,Name --no-header \
            | awk -v n="$NAME" '$2==n{print $1}' | xargs -r doctl compute droplet delete --force || true
          cutoff=$(date -u -d '3 hours ago' +%s)
          doctl compute droplet list --tag-name nebo-ci-runner --format ID,Created --no-header | while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ] && doctl compute droplet delete --force "$id" || true
          done
      # A one-job runner removes itself after its job; if the job never ran,
      # its registration would linger as offline. Remove it either way.
      - name: Remove the runner registration
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          NAME: publisher-amd64-${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          id=$(gh api "orgs/$OWNER/actions/runners?name=$NAME" -q '.runners[0].id // empty')
          [ -n "$id" ] && gh api -X DELETE "orgs/$OWNER/actions/runners/$id" || true

  release:
    needs: build
    runs-on: [self-hosted, Linux, ARM64, neboloop]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package the skill and checksums
        run: |
          mkdir -p dist
          cp artifacts/neboai-*/neboai-* dist/
          # The publisher skill as installed into an AI tool's skills folder:
          # neboai/SKILL.md + references/ + scripts/ + examples/.
          mkdir -p skill/neboai
          cp -R SKILL.md references scripts examples skill/neboai/
          tar -czf dist/neboai-skill.tar.gz -C skill neboai
          (cd dist && sha256sum neboai-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/neboai-darwin-arm64
            dist/neboai-darwin-amd64
            dist/neboai-linux-arm64
            dist/neboai-linux-amd64
            dist/neboai-windows-amd64.exe
            dist/neboai-skill.tar.gz
            dist/SHA256SUMS

      - name: Keep checksums for the Homebrew job
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: dist/SHA256SUMS

  homebrew:
    needs: release
    runs-on: [self-hosted, Linux, ARM64, neboloop]
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Require the tap token
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error title=Homebrew formula not updated::Secret TAP_GITHUB_TOKEN is not set on NeboLoop/publisher. Add a token with contents:write on NeboLoop/homebrew-tap (gh secret set TAP_GITHUB_TOKEN -R NeboLoop/publisher), then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: NeboLoop/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - uses: actions/download-artifact@v4
        with:
          name: sha256sums

      - name: Render Formula/neboai.rb
        run: |
          sha() { awk -v f="neboai-$1" '$2 == f { print $1 }' SHA256SUMS; }
          export PKG_VERSION="${GITHUB_REF_NAME#v}"
          export SHA_DARWIN_ARM64="$(sha darwin-arm64)" SHA_DARWIN_AMD64="$(sha darwin-amd64)"
          export SHA_LINUX_ARM64="$(sha linux-arm64)" SHA_LINUX_AMD64="$(sha linux-amd64)"
          for v in SHA_DARWIN_ARM64 SHA_DARWIN_AMD64 SHA_LINUX_ARM64 SHA_LINUX_AMD64; do
            [ -n "${!v}" ] || { echo "::error::missing checksum $v"; exit 1; }
          done
          mkdir -p homebrew-tap/Formula
          envsubst '${PKG_VERSION} ${SHA_DARWIN_ARM64} ${SHA_DARWIN_AMD64} ${SHA_LINUX_ARM64} ${SHA_LINUX_AMD64}' \
            < source/packaging/neboai.rb.tmpl > homebrew-tap/Formula/neboai.rb
          cat homebrew-tap/Formula/neboai.rb

      - name: Push formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/neboai.rb
          # A re-run finds the tap already at this version.
          git commit -m "Update neboai to ${GITHUB_REF_NAME}" || echo "No changes"
          git push

  npm:
    needs: release
    runs-on: [self-hosted, Linux, ARM64, neboloop]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Require a working npm token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=npm not published::Secret NPM_TOKEN is not set on NeboLoop/publisher. Add an npm automation token that can publish @neboai/publisher (gh secret set NPM_TOKEN -R NeboLoop/publisher), then re-run this job."
            exit 1
          fi
          if ! who=$(npm whoami 2>&1); then
            echo "::error title=npm not published::NPM_TOKEN was rejected by npm ($who). Replace it with a valid automation token that can publish @neboai/publisher (gh secret set NPM_TOKEN -R NeboLoop/publisher), then re-run this job."
            exit 1
          fi
          echo "Publishing to npm as $who"

      - name: Publish to npm
        run: npm publish --access public
